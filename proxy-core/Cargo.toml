[package]
name = "proxy-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[[bin]]
name = "proxy-core"
path = "src/main.rs"

[dependencies]
# TLS with ECH support (local rustls fork via workspace patch)
rustls = { version = "0.23", features = ["aws-lc-rs", "std"] }
rustls-pki-types = "1.13"
webpki-roots = "0.26"
tokio-rustls = "0.26"

# Yamux multiplexing
yamux = "0.13"

# WebSocket (compatible with rustls 0.24)
tokio-tungstenite = { version = "0.24", default-features = false }
tungstenite = "0.24"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "compat"] }
futures = "0.3"

# HTTP/DNS (using native-tls to avoid conflicts with local rustls fork)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
bytes = "1.5"
url = "2.5"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
