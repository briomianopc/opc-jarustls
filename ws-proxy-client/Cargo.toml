[package]
name = "ws-proxy-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
# TLS with fingerprint randomization
rustls = { path = "../rustls", features = ["aws-lc-rs"] }
rustls-pki-types = "1.13"
webpki-roots = "1"

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.24"

# Yamux multiplexing
yamux = "0.13"

# Async runtime
tokio = { version = "1.34", features = ["full"] }
futures = "0.3"

# Networking
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.5"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI
clap = { version = "4.3", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"
base64 = "0.22"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
